function estFood(desc){
  const d=desc.toLowerCase().replace(/[,\.!?&]/g,' ').replace(/\s+/g,' ').trim();
  if(!d)return null;
  const keys=Object.keys(FDB).sort((a,b)=>b.length-a.length);
  let matched=[];let rem=d;
  for(const k of keys){const i=rem.indexOf(k);if(i!==-1){matched.push({k,f:FDB[k]});rem=rem.substring(0,i)+rem.substring(i+k.length);}}
  let m=1;
  const nm=d.match(/(\d+)\s/);if(nm&&+nm[1]>1&&+nm[1]<10)m=+nm[1];
  if(/large|big|extra/i.test(d))m*=1.4;if(/small|half|lite/i.test(d))m*=0.6;if(/double|two|2x/i.test(d)&&m===1)m=2;
  if(!matched.length){
    if(/breakfast/i.test(d))return{name:"Breakfast",cal:500,p:25,c:55,f:18};
    if(/lunch/i.test(d))return{name:"Lunch",cal:600,p:35,c:60,f:20};
    if(/dinner/i.test(d))return{name:"Dinner",cal:700,p:40,c:65,f:25};
    return{name:desc,cal:400,p:20,c:45,f:15};
  }
  let t={cal:0,p:0,c:0,f:0};const names=[];
  matched.forEach(({k,f})=>{const sv=f.s/100*m;t.cal+=Math.round(f.c*sv);t.p+=Math.round(f.p*sv);t.c+=Math.round(f.cb*sv);t.f+=Math.round(f.f*sv);names.push(k.split(' ').map(w=>w[0].toUpperCase()+w.slice(1)).join(' '));});
  return{name:names.join(' + '),cal:t.cal,p:t.p,c:t.c,f:t.f};
}

function detectEx(name){

  for(const e of EDB){for(const k of e.k){if(n.includes(k))return{name:name.charAt(0).toUpperCase()+name.slice(1),primary:e.p,secondary:e.s,note:"",sets:e.st||3,reps:e.r||"10-12",isCore:!!e.co};}}

function RemoveBtn({label,onConfirm,style:s}){
  const[c,setC]=useState(false);const t=useRef(null);
  useEffect(()=>()=>clearTimeout(t.current),[]);
  return <button onClick={e=>{e.stopPropagation();if(c){onConfirm();setC(false);}else{setC(true);t.current=setTimeout(()=>setC(false),2500);}}} style={{...s,...(c?{borderColor:C.red,color:C.red,background:"#EF444418"}:{})}}>{c?"Sure?":label}</button>;
}

/* ══════ BODY SILHOUETTE ══════ */
function BodyMap({muscles}){
  const mx=Math.max(1,...Object.values(muscles));
  const hc=v=>{if(!v)return"#222";const p=v/mx;return p>.7?"#22C55E":p>.4?"#D4A843":"#D4A84355";};
  // Map muscle names to body region colors
  const chest=muscles["Chest"]||0;const fDelt=(muscles["Front Delts"]||0)+(muscles["Side Delts"]||0);const rDelt=muscles["Rear Delts"]||0;const tri=muscles["Triceps"]||0;const bi=muscles["Biceps"]||0;const ub=(muscles["Upper Back"]||0)+(muscles["Lats"]||0);const lb=muscles["Lower Back"]||0;const core=muscles["Core"]||0;const quad=muscles["Quads"]||0;const ham=muscles["Hamstrings"]||0;const glut=muscles["Glutes"]||0;const calf=muscles["Calves"]||0;

  return (
    <svg viewBox="0 0 200 380" width="160" height="300" style={{display:"block",margin:"0 auto"}}>
      {/* Head */}
      <circle cx="100" cy="30" r="20" fill="#333" stroke="#444" strokeWidth="1"/>
      {/* Neck */}
      <rect x="92" y="48" width="16" height="12" fill="#333" rx="4"/>
      {/* Shoulders/Delts */}
      <ellipse cx="62" cy="72" rx="18" ry="12" fill={hc(fDelt)} stroke="#444" strokeWidth=".5"/>
      <ellipse cx="138" cy="72" rx="18" ry="12" fill={hc(fDelt)} stroke="#444" strokeWidth=".5"/>
      {/* Chest */}
      <ellipse cx="84" cy="88" rx="18" ry="16" fill={hc(chest)} stroke="#444" strokeWidth=".5"/>
      <ellipse cx="116" cy="88" rx="18" ry="16" fill={hc(chest)} stroke="#444" strokeWidth=".5"/>
      {/* Upper Arms - Biceps/Triceps */}
      <rect x="38" y="78" width="14" height="40" rx="7" fill={hc(Math.max(bi,tri))} stroke="#444" strokeWidth=".5"/>
      <rect x="148" y="78" width="14" height="40" rx="7" fill={hc(Math.max(bi,tri))} stroke="#444" strokeWidth=".5"/>
      {/* Forearms */}
      <rect x="36" y="120" width="12" height="38" rx="6" fill={hc(bi)} stroke="#444" strokeWidth=".5" transform="rotate(5,42,139)"/>
      <rect x="152" y="120" width="12" height="38" rx="6" fill={hc(bi)} stroke="#444" strokeWidth=".5" transform="rotate(-5,158,139)"/>
      {/* Core/Abs */}
      <rect x="78" y="104" width="44" height="52" rx="8" fill={hc(core)} stroke="#444" strokeWidth=".5"/>
      {/* Upper Back (behind — shown as outline) */}
      <rect x="68" y="65" width="64" height="38" rx="10" fill="none" stroke={hc(ub)} strokeWidth="2" strokeDasharray="3,3"/>
      {/* Lower Back */}
      <rect x="82" y="148" width="36" height="20" rx="6" fill={hc(lb)} stroke="#444" strokeWidth=".5"/>
      {/* Glutes */}
      <ellipse cx="88" cy="180" rx="16" ry="14" fill={hc(glut)} stroke="#444" strokeWidth=".5"/>
      <ellipse cx="112" cy="180" rx="16" ry="14" fill={hc(glut)} stroke="#444" strokeWidth=".5"/>
      {/* Quads */}
      <rect x="72" y="195" width="22" height="60" rx="10" fill={hc(quad)} stroke="#444" strokeWidth=".5"/>
      <rect x="106" y="195" width="22" height="60" rx="10" fill={hc(quad)} stroke="#444" strokeWidth=".5"/>
      {/* Hamstrings (behind — dashed) */}
      <rect x="74" y="200" width="18" height="50" rx="8" fill="none" stroke={hc(ham)} strokeWidth="2" strokeDasharray="3,3"/>
      <rect x="108" y="200" width="18" height="50" rx="8" fill="none" stroke={hc(ham)} strokeWidth="2" strokeDasharray="3,3"/>
      {/* Calves */}
      <rect x="74" y="262" width="18" height="50" rx="8" fill={hc(calf)} stroke="#444" strokeWidth=".5"/>
      <rect x="108" y="262" width="18" height="50" rx="8" fill={hc(calf)} stroke="#444" strokeWidth=".5"/>
      {/* Feet */}
      <ellipse cx="83" cy="318" rx="12" ry="6" fill="#333"/>
      <ellipse cx="117" cy="318" rx="12" ry="6" fill="#333"/>
      {/* Labels */}
      <text x="100" y="374" textAnchor="middle" fill="#555" fontSize="9" fontFamily="'DM Sans'">Solid = front · Dashed = back</text>
    </svg>
  );
}

/* ══════ MAIN APP ══════ */
function App(){
  const[tab,setTab]=useState("workout");
  const[curDate,setCurDate]=useState(today());
  const[,forceRender]=useState(0);
  const rerender=()=>forceRender(n=>n+1);
  const todayStr=today();
  const cDow=dow(parse(curDate));
  const sc=SCHED[cDow];

  // Read from localStorage on every render — no stale state
  const dd=getDay(curDate);
  const hist=getHist();
  const workouts=getWorkouts()||DEF_W;
  const suppList=getSuppList()||DEF_SUPPS;
  const exW=getExW();
  const wo=workouts[cDow];
  const mac=MAC[sc?.t]||MAC.rest;
  const totalS=wo?wo.exercises.reduce((a,e)=>a+e.sets,0):0;
  const doneS=Object.keys(dd.sets).filter(k=>k.startsWith(`${cDow}-`)&&dd.sets[k]).length;
  const tots={cal:dd.meals.reduce((a,m)=>a+(m.cal||0),0),p:dd.meals.reduce((a,m)=>a+(m.p||0),0),c:dd.meals.reduce((a,m)=>a+(m.c||0),0),f:dd.meals.reduce((a,m)=>a+(m.f||0),0)};

  // Save function reads fresh from LS, merges, writes back
  const save=(patch)=>{
    const prev=getDay(curDate);
    const next={...prev,...patch};
    putDay(curDate,next);
    // Update hist
    const h=getHist();
    const w=workouts[cDow];const mh={};
    if(w){w.exercises.forEach((ex,ei)=>{if(Array.from({length:ex.sets},(_,si)=>next.sets[`${cDow}-${ei}-${si}`]).some(Boolean)){(ex.primary||[]).forEach(m=>{mh[m]=(mh[m]||0)+2;});(ex.secondary||[]).forEach(m=>{mh[m]=(mh[m]||0)+1;});}});}
    const ms=next.meals||[];
    h[curDate]={p:ms.reduce((a,m)=>a+(m.p||0),0),cal:ms.reduce((a,m)=>a+(m.cal||0),0),c:ms.reduce((a,m)=>a+(m.c||0),0),f:ms.reduce((a,m)=>a+(m.f||0),0),water:next.water,sleep:next.sleep,bw:next.bw,muscles:mh,dayType:sc.t,setsD:Object.values(next.sets).filter(Boolean).length,setsT:w?w.exercises.reduce((a,e)=>a+e.sets,0):0};
    putHist(h);
    rerender();
  };
  const saveWO=(w)=>{putWorkouts(w);rerender();};
  const saveSL=(s)=>{putSuppList(s);rerender();};
  const saveExW=(name,wt)=>{const e=getExW();e[name.toLowerCase()]=wt;putExW(e);rerender();};

  // Timer
  const[timer,setTimer]=useState(0);
  const[timerOn,setTimerOn]=useState(false);
  const timerEnd=useRef(0);
  useEffect(()=>{
    if(!timerOn)return;
    const id=setInterval(()=>{
      const left=Math.max(0,Math.ceil((timerEnd.current-Date.now())/1000));
      setTimer(left);
      if(left<=0){setTimerOn(false);clearInterval(id);}
    },250);
    return()=>clearInterval(id);
  },[timerOn]);
  const startTimer=()=>{timerEnd.current=Date.now()+90000;setTimer(90);setTimerOn(true);};

  return (
    <div style={{fontFamily:"'DM Sans',sans-serif",background:C.bg,color:C.txt,minHeight:"100vh",maxWidth:480,margin:"0 auto",paddingBottom:80}}>
      {/* HERO */}
      <div style={{padding:"16px 20px 0",background:"linear-gradient(180deg,#1a1610,#0C0C0C)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
          <div style={{fontSize:11,fontWeight:600,color:C.gold,letterSpacing:2,textTransform:"uppercase"}}>May Lock-In · Week {weekN()}</div>
          <div style={{fontSize:11,color:C.sub}}>{daysUntilJune()}d to June 1</div>
        </div>
        <div style={{fontFamily:"'Oswald'",fontSize:44,fontWeight:700,lineHeight:1}}>{curDate===todayStr?"TODAY":dayN[cDow].toUpperCase()}</div>
        <div style={{fontFamily:"'Oswald'",fontSize:44,fontWeight:700,lineHeight:1,color:C.gold}}>{sc.ti}</div>
        <div style={{fontSize:12,color:C.sub,marginTop:4,letterSpacing:1,textTransform:"uppercase"}}>{sc.su}</div>
        {/* Date Nav */}
        <div style={{display:"flex",alignItems:"center",gap:6,marginTop:12,paddingBottom:12}}>
          <button onClick={()=>setCurDate(fmt(addD(parse(curDate),-1)))} style={{background:"none",border:"1px solid #333",borderRadius:8,padding:"6px 10px",color:C.sub,fontSize:16,cursor:"pointer"}}>‹</button>
          <div style={{flex:1,display:"flex",gap:3}}>{SCHED.map((s,i)=>{
            const td=fmt(addD(parse(curDate),i-cDow));const sel=td===curDate;const isT=td===todayStr;
            return <button key={i} onClick={()=>setCurDate(td)} style={{flex:1,padding:"6px 0",borderRadius:6,border:`1px solid ${sel?C.gold:"#1a1a1a"}`,background:sel?C.gd:"transparent",color:sel?C.gold:C.mut,fontSize:10,fontWeight:700,cursor:"pointer",position:"relative",fontFamily:"'DM Sans'"}}>{s.d}{isT&&<div style={{width:4,height:4,borderRadius:"50%",background:C.gold,position:"absolute",top:1,right:"calc(50% - 2px)"}}/>}</button>;
          })}</div>
          <button onClick={()=>setCurDate(fmt(addD(parse(curDate),1)))} style={{background:"none",border:"1px solid #333",borderRadius:8,padding:"6px 10px",color:C.sub,fontSize:16,cursor:"pointer"}}>›</button>
          {curDate!==todayStr&&<button onClick={()=>setCurDate(todayStr)} style={{background:C.gold,border:"none",borderRadius:8,padding:"6px 8px",color:"#000",fontSize:10,fontWeight:700,cursor:"pointer"}}>Now</button>}
        </div>
      </div>
      <div style={{padding:"0 16px"}}>
        {tab==="workout"&&<WTab {...{wo,sc,cDow,dd,save,workouts,saveWO,timer,timerOn,startTimer,setTimerOn,setTimer,totalS,doneS,exW,saveExW}}/>}
        {tab==="nutrition"&&<NTab {...{dd,save,tots,mac,sc}}/>}
        {tab==="tracker"&&<TTab {...{hist,exW}}/>}
        {tab==="vitals"&&<VTab {...{dd,save,suppList,saveSL,curDate}}/>}
      </div>
      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:480,display:"flex",background:"#111",borderTop:"1px solid #1a1a1a",zIndex:100,padding:"6px 0 env(safe-area-inset-bottom,14px)"}}>
        {[{id:"workout",l:"Workout",e:"◎"},{id:"nutrition",l:"Nutrition",e:"◈"},{id:"tracker",l:"Tracker",e:"◉"},{id:"vitals",l:"Vitals",e:"♡"}].map(t=> <button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,background:"none",border:"none",color:tab===t.id?C.gold:C.mut,display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:"6px 0",cursor:"pointer",fontFamily:"'DM Sans'"}}><span style={{fontSize:20}}>{t.e}</span><span style={{fontSize:10,fontWeight:700}}>{t.l}</span></button>)}
      </div>
    </div>
  );
}

/* ══════ WORKOUT TAB — per-set weight tracking ══════ */
function WTab({wo,sc,cDow,dd,save,workouts,saveWO,timer,timerOn,startTimer,setTimerOn,setTimer,totalS,doneS,exW,saveExW}){
  const[exp,setExp]=useState(null);const[adding,setAdding]=useState(false);const[addN,setAddN]=useState("");const[editing,setEditing]=useState(null);const[ef,setEf]=useState({});
  const toggleSet=(key,exName,wt)=>{const ns={...dd.sets,[key]:!dd.sets[key]};save({sets:ns});if(!dd.sets[key]){startTimer();if(wt)saveExW(exName,wt);}};
  const setWt=(key,val)=>{const nw={...dd.wts,[key]:val};save({wts:nw});};
  const addEx=()=>{if(!addN.trim())return;const det=detectEx(addN);const u={...workouts};if(!u[cDow])u[cDow]={title:SCHED[cDow].ti,exercises:[]};u[cDow]={...u[cDow],exercises:[...u[cDow].exercises,{id:uid(),...det}]};saveWO(u);setAddN("");setAdding(false);};
  const rmEx=ei=>{const u={...workouts};u[cDow]={...u[cDow],exercises:u[cDow].exercises.filter((_,i)=>i!==ei)};saveWO(u);};
  const mvEx=(ei,dir)=>{const exs=[...wo.exercises];const ni=ei+dir;if(ni<0||ni>=exs.length)return;[exs[ei],exs[ni]]=[exs[ni],exs[ei]];saveWO({...workouts,[cDow]:{...workouts[cDow],exercises:exs}});};
  const svEdit=ei=>{const exs=[...workouts[cDow].exercises];exs[ei]={...exs[ei],sets:+ef.sets||exs[ei].sets,reps:ef.reps||exs[ei].reps,note:ef.note??exs[ei].note};saveWO({...workouts,[cDow]:{...workouts[cDow],exercises:exs}});setEditing(null);};

  if(!wo||!wo.exercises?.length)return <div className="fi" style={{textAlign:"center",padding:"40px 20px"}}><div style={{fontSize:56}}>{sc.ic}</div><div style={{fontFamily:"'Oswald'",fontSize:28,fontWeight:700,marginTop:12,color:C.gold}}>{sc.ti}</div><div style={{color:C.sub,marginTop:8}}>{sc.t==="soccer"?"Fresh legs today.":sc.t==="rest"?"Rest, hydrate, prep.":"No exercises yet."}</div>{sc.t==="gym"&&<Btn gold onClick={()=>setAdding(true)} style={{marginTop:16}}>+ Add Exercise</Btn>}{adding&&<div style={{marginTop:12}}><AddBox n={addN} setN={setAddN} add={addEx} cancel={()=>setAdding(false)}/></div>}</div>;

  return (
    <div className="fi">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:4,marginBottom:12}}>
        <div><div style={{fontSize:12,fontWeight:600,color:C.sub,textTransform:"uppercase",letterSpacing:1}}>Sets</div><div style={{display:"flex",alignItems:"baseline",gap:4,marginTop:2}}><span style={{fontFamily:"'Oswald'",fontSize:28,fontWeight:700,color:doneS===totalS&&totalS>0?C.grn:C.txt}}>{doneS}</span><span style={{fontSize:14,color:C.mut}}>/ {totalS}</span></div></div>
        <button onClick={()=>timerOn?(setTimerOn(false),setTimer(0)):startTimer()} style={{padding:"10px 16px",borderRadius:10,border:`1px solid ${timerOn?(timer<=10?C.red:C.gold):"#333"}`,background:timerOn?(timer<=10?"#EF444422":C.gd):C.card,color:timerOn?(timer<=10?C.red:C.gold):C.sub,fontSize:14,fontWeight:700,fontFamily:"'Oswald'",letterSpacing:1,cursor:"pointer",animation:timerOn&&timer<=10?"timerPulse .5s ease infinite":"none"}}>{timerOn?`⏱ ${timer}s`:"⏱ 90s"}</button>
      </div>
      <div style={{height:3,background:"#222",borderRadius:2,marginBottom:14}}><div style={{height:"100%",width:`${totalS?(doneS/totalS)*100:0}%`,background:`linear-gradient(90deg,${C.gold},#E8C66A)`,borderRadius:2,transition:"width .4s"}}/></div>

      {wo.exercises.map((ex,ei)=>{
        const allD=Array.from({length:ex.sets},(_,si)=>dd.sets[`${cDow}-${ei}-${si}`]).every(Boolean);
        const isE=exp===ei;const lastW=exW[ex.name.toLowerCase()]||"";
        return (
          <div key={ex.id||ei} style={{background:allD?"#22C55E0C":C.card,border:`1px solid ${allD?"#22C55E33":ex.isCore?C.gold+"55":C.cb}`,borderRadius:14,padding:"14px 16px",marginBottom:10,borderLeft:ex.isCore?`3px solid ${C.gold}`:undefined}}>
            <div style={{display:"flex",justifyContent:"space-between",cursor:"pointer"}} onClick={()=>{setExp(isE?null:ei);setEditing(null);}}>
              <div style={{flex:1}}><div style={{fontSize:15,fontWeight:700,color:allD?C.grn:C.txt}}>{ex.name}</div><div style={{fontSize:11,color:ex.isCore?C.gold:C.sub,fontStyle:"italic",marginTop:2}}>{ex.note}</div></div>
              <div style={{fontFamily:"'Oswald'",fontSize:16,fontWeight:600,color:C.gold,marginLeft:8}}>{ex.sets}×{ex.reps}</div>
            </div>
            <div style={{display:"flex",flexWrap:"wrap",gap:3,marginTop:6}}>{(ex.primary||[]).map(m=> <span key={m} style={{fontSize:9,fontWeight:700,padding:"2px 6px",borderRadius:4,background:C.gold+"22",color:C.gold}}>{m}</span>)}{(ex.secondary||[]).map(m=> <span key={m} style={{fontSize:9,fontWeight:600,padding:"2px 6px",borderRadius:4,background:"#ffffff08",color:C.sub}}>{m}</span>)}</div>

            {isE&&<div style={{marginTop:10}}>
              {editing===ei?<div style={{display:"flex",flexDirection:"column",gap:6,padding:10,background:"#111",borderRadius:8,marginBottom:8}}>
                <div style={{display:"flex",gap:6}}><div style={{flex:1}}><div style={{fontSize:10,color:C.sub}}>Sets</div><input type="number" value={ef.sets} onChange={e=>setEf({...ef,sets:e.target.value})} style={sinp}/></div><div style={{flex:1}}><div style={{fontSize:10,color:C.sub}}>Reps</div><input value={ef.reps} onChange={e=>setEf({...ef,reps:e.target.value})} style={sinp}/></div></div>
                <div><div style={{fontSize:10,color:C.sub}}>Note</div><input value={ef.note} onChange={e=>setEf({...ef,note:e.target.value})} style={sinp}/></div>
                <div style={{display:"flex",gap:6}}><Btn green onClick={()=>svEdit(ei)}>Save</Btn><Btn onClick={()=>setEditing(null)}>Cancel</Btn></div>
              </div>:<>
                <div style={{display:"flex",gap:5,marginBottom:10,flexWrap:"wrap"}}>

                  <Btn small onClick={e=>{e.stopPropagation();mvEx(ei,-1);}}>↑</Btn><Btn small onClick={e=>{e.stopPropagation();mvEx(ei,1);}}>↓</Btn>
                  <RemoveBtn label="✕" onConfirm={()=>rmEx(ei)} style={{padding:"5px 10px",borderRadius:6,background:"none",border:`1px solid ${C.red}44`,color:C.red,fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"'DM Sans'"}}/>
                </div>
                {lastW&&<div style={{fontSize:11,color:C.gold,marginBottom:8}}>Last session: <b>{lastW} lbs</b> — match or beat it</div>}

                        <input type="text" inputMode="numeric" placeholder={lastW||"lbs"} value={wVal} onChange={e=>setWt(wKey,e.target.value)} style={{background:"#111",border:"1px solid #2a2a2a",borderRadius:8,padding:"8px 10px",color:C.txt,fontSize:13,width:80,outline:"none",fontFamily:"'DM Sans'",textAlign:"center"}}/>
                        <span style={{fontSize:10,color:C.mut}}>lbs</span>
                        <div style={{flex:1}}/>

                      </div>
                    );

              </>}
            </div>}
          </div>
        );
      })}
      {!adding? <button onClick={()=>setAdding(true)} style={{width:"100%",padding:"12px",borderRadius:12,border:"1px dashed #333",background:"transparent",color:C.sub,fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"'DM Sans'"}}>+ Add Exercise</button>:<AddBox n={addN} setN={setAddN} add={addEx} cancel={()=>setAdding(false)}/>}
      <div style={{height:16}}/>
    </div>
  );
}
function AddBox({n,setN,add,cancel}){return <Card><Lbl>Add Exercise</Lbl><div style={{fontSize:11,color:C.sub,marginBottom:8}}>Type any exercise — muscles auto-detected.</div><div style={{display:"flex",gap:8}}><input placeholder="e.g. Cable Flyes..." value={n} onChange={e=>setN(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()} style={{...inp,flex:1}}/><Btn gold onClick={add}>Add</Btn></div><Btn small onClick={cancel} style={{marginTop:8}}>Cancel</Btn></Card>;}

/* ══════ NUTRITION TAB ══════ */

  const addMan=()=>{if(!f.n)return;save({meals:[...dd.meals,{name:f.n,cal:+f.cal||0,p:+f.p||0,c:+f.c||0,f:+f.f||0,flex,time:new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}]});setF({n:"",cal:"",p:"",c:"",f:""});setFlex(false);setShowM(false);};
  const rmMeal=i=>save({meals:dd.meals.filter((_,j)=>j!==i)});

  return (

      <div style={{fontFamily:"'Oswald'",fontSize:28,fontWeight:700}}>NUTRITION</div>
      <div style={{fontSize:12,color:C.gold,fontWeight:600,textTransform:"uppercase",letterSpacing:1,marginTop:-8}}>{dl} · {mac.cal} cal</div>
      <Card>{[{l:"Calories",v:tots.cal,t:mac.cal,col:C.gold,u:""},{l:"Protein",v:tots.p,t:mac.p,col:C.grn,u:"g"},{l:"Carbs",v:tots.c,t:mac.c,col:C.blu,u:"g"},{l:"Fat",v:tots.f,t:mac.f,col:C.pur,u:"g"}].map((m,i)=> <div key={i} style={{marginBottom:i<3?10:0}}><div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4}}><span style={{color:C.sub,fontWeight:600}}>{m.l}</span><span style={{fontWeight:600}}>{m.v}{m.u} <span style={{color:C.mut}}>/ {m.t}{m.u}</span></span></div><div style={{height:6,background:"#222",borderRadius:3}}><div style={{height:"100%",width:`${Math.min(100,(m.v/m.t)*100)}%`,background:m.col,borderRadius:3,transition:"width .3s"}}/></div></div>)}</Card>
      <Card><Lbl>Log Meal</Lbl><div style={{display:"flex",gap:8}}><input placeholder='e.g. "chicken with rice and broccoli"' value={desc} onChange={e=>setDesc(e.target.value)} onKeyDown={e=>e.key==="Enter"&&est()} style={{...inp,flex:1}}/><Btn gold onClick={est}>Est.</Btn></div>
        {res&&<div style={{marginTop:10,padding:12,background:"#111",borderRadius:10,border:`1px solid ${C.gold}33`}}>
          <div style={{fontSize:14,fontWeight:700,color:C.gold,marginBottom:6}}>{res.name}</div>
          <div style={{display:"flex",gap:8,fontSize:12,color:C.sub,marginBottom:10,flexWrap:"wrap"}}><span><b style={{color:C.txt}}>{res.cal}</b>cal</span><span><b style={{color:C.grn}}>{res.p}g</b>P</span><span><b style={{color:C.blu}}>{res.c}g</b>C</span><span><b style={{color:C.pur}}>{res.f}g</b>F</span></div>
          <div style={{display:"flex",gap:8}}><Btn green onClick={()=>confirmR(false)} style={{flex:1}}>🥗 Log Clean</Btn><Btn onClick={()=>confirmR(true)} style={{flex:1,background:"#D4A84333",border:`1px solid ${C.gold}44`,color:C.gold}}>🍕 Log Flex</Btn></div>
        </div>}
      </Card>
      <Card><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}><Lbl>80/20</Lbl><Btn small onClick={()=>setShowM(!showM)}>Manual</Btn></div><div style={{display:"flex",gap:8}}><div style={{padding:"4px 10px",borderRadius:6,fontSize:12,fontWeight:700,background:C.gd2,color:C.grn}}>{dd.meals.length-fN} Clean</div><div style={{padding:"4px 10px",borderRadius:6,fontSize:12,fontWeight:700,background:"#D4A84322",color:C.gold}}>{fN} Flex</div></div></Card>
      {showM&&<Card><Lbl>Manual Entry</Lbl><div style={{display:"flex",flexDirection:"column",gap:6}}><input placeholder="Meal name" value={f.n} onChange={e=>setF({...f,n:e.target.value})} style={inp}/><div style={{display:"flex",gap:4}}><input placeholder="Cal" type="number" value={f.cal} onChange={e=>setF({...f,cal:e.target.value})} style={{...sinp,flex:1}}/><input placeholder="P(g)" type="number" value={f.p} onChange={e=>setF({...f,p:e.target.value})} style={{...sinp,flex:1}}/><input placeholder="C(g)" type="number" value={f.c} onChange={e=>setF({...f,c:e.target.value})} style={{...sinp,flex:1}}/><input placeholder="F(g)" type="number" value={f.f} onChange={e=>setF({...f,f:e.target.value})} style={{...sinp,flex:1}}/></div><div style={{display:"flex",gap:8}}><Btn onClick={()=>setFlex(!flex)} style={{flex:1,background:flex?"#D4A84322":C.card,border:`1px solid ${flex?C.gold+"66":"#333"}`,color:flex?C.gold:C.sub}}>{flex?"🍕 Flex":"🥗 Clean"}</Btn><Btn gold onClick={addMan}>Log Meal</Btn></div></div></Card>}
      {dd.meals.length>0&&<Card><Lbl>Meals</Lbl>{dd.meals.map((m,i)=> <div key={i} style={{display:"flex",alignItems:"center",padding:"8px 0",borderTop:i?"1px solid #1a1a1a":"none",gap:8}}><div style={{flex:1}}><div style={{display:"flex",alignItems:"center",gap:6}}><span style={{fontSize:13,fontWeight:600}}>{m.name}</span>{m.flex&&<span style={{fontSize:8,fontWeight:700,background:"#D4A84333",color:C.gold,padding:"1px 5px",borderRadius:4}}>FLEX</span>}</div><div style={{fontSize:11,color:C.sub,marginTop:1}}>{m.cal}cal · {m.p}gP · {m.c}gC · {m.f}gF{m.time?` · ${m.time}`:""}</div></div><button onClick={()=>rmMeal(i)} style={{background:"none",border:"none",color:C.mut,fontSize:16,cursor:"pointer",padding:"4px 8px"}}>✕</button></div>)}</Card>}
      <Card><Lbl>Quick Add</Lbl><div style={{display:"flex",flexWrap:"wrap",gap:5}}>{QM.map((q,i)=> <button key={i} onClick={()=>addQ(q)} style={{display:"flex",flexDirection:"column",gap:1,padding:"7px 10px",borderRadius:8,background:"#111",border:"1px solid #222",color:C.txt,fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"'DM Sans'"}}>{q.name}<span style={{fontSize:9,color:C.sub}}>{q.cal}cal·{q.p}gP</span></button>)}</div></Card>
      <div style={{height:12}}/>
    </div>
  );
}

/* ══════ TRACKER TAB ══════ */
function TTab({hist,exW}){
  const streak=(()=>{let s=0;const d=new Date();d.setDate(d.getDate()-1);while(hist[fmt(d)]){s++;d.setDate(d.getDate()-1);}return s;})();
  const l14=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);l14.push({date:fmt(d).slice(5),dn:shortD[d.getDay()],data:hist[fmt(d)]||null});}
  const wm={};for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);const h=hist[fmt(d)];if(h?.muscles)Object.entries(h.muscles).forEach(([m,v])=>{wm[m]=(wm[m]||0)+v;});if((d.getDay()===2||d.getDay()===5)&&h){["Quads","Hamstrings","Glutes","Calves","Core","Hip Flexors"].forEach(m=>{wm[m]=(wm[m]||0)+2;});}}
  const mx=Math.max(1,...Object.values(wm));const getHC=v=>{if(!v)return"#1a1a1a";const p=v/mx;return p>.7?C.grn:p>.4?C.gold:"#D4A84366";};
  const upper=["Chest","Front Delts","Side Delts","Rear Delts","Triceps","Biceps","Upper Back","Lats"].reduce((a,m)=>a+(wm[m]||0),0);
  const lower=["Quads","Hamstrings","Glutes","Calves","Hip Flexors"].reduce((a,m)=>a+(wm[m]||0),0);const core=wm["Core"]||0;
  const pD=l14.filter(d=>d.data?.p).map(d=>({l:d.date,v:d.data.p}));const cD=l14.filter(d=>d.data?.cal).map(d=>({l:d.date,v:d.data.cal}));
  const wD=Object.entries(hist).filter(([_,v])=>v.bw).sort(([a],[b])=>a.localeCompare(b)).slice(-14).map(([d,v])=>({l:d.slice(5),v:+v.bw}));
  const wDays=l14.filter(d=>d.data?.setsT>0);const cDays=wDays.filter(d=>d.data.setsD===d.data.setsT).length;
  const exWE=Object.entries(exW).filter(([_,v])=>v).sort(([a],[b])=>a.localeCompare(b));

  return (
    <div className="fi" style={{display:"flex",flexDirection:"column",gap:12,paddingTop:8}}>
      <div style={{fontFamily:"'Oswald'",fontSize:28,fontWeight:700}}>TRACKER</div>
      <div style={{fontSize:12,color:C.gold,fontWeight:600,textTransform:"uppercase",letterSpacing:1,marginTop:-8}}>{streak>0?`${streak} day streak`:"Day 1"} · Week {weekN()} · {daysUntilJune()}d left</div>
      <div style={{display:"flex",gap:8}}>{[{n:streak,l:"Streak"},{n:`${cDays}/${wDays.length}`,l:"Workouts"},{n:`Wk ${weekN()}`,l:"of 4"}].map((s,i)=> <div key={i} style={{flex:1,background:C.card,borderRadius:12,padding:"12px 10px",textAlign:"center",border:`1px solid ${C.cb}`}}><div style={{fontFamily:"'Oswald'",fontSize:22,fontWeight:700,color:C.gold}}>{s.n}</div><div style={{fontSize:10,color:C.sub,textTransform:"uppercase",marginTop:2}}>{s.l}</div></div>)}</div>

      {/* Body Silhouette */}
      <Card><Lbl>Muscle Heatmap · This Week</Lbl><BodyMap muscles={wm}/></Card>

      <Card><Lbl>Volume Split</Lbl>
        <div style={{display:"flex",gap:8,marginBottom:12}}>{[{l:"Upper",v:upper,c:C.blu},{l:"Lower",v:lower,c:C.grn},{l:"Core",v:core,c:C.gold}].map((g,i)=> <div key={i} style={{flex:1,textAlign:"center",padding:"10px 0",background:g.c+"15",borderRadius:10,border:`1px solid ${g.c}33`}}><div style={{fontFamily:"'Oswald'",fontSize:20,fontWeight:700,color:g.c}}>{g.v}</div><div style={{fontSize:10,color:C.sub,textTransform:"uppercase"}}>{g.l}</div></div>)}</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:5}}>{MS.map(m=>{const v=wm[m]||0;const col=getHC(v);return <div key={m} style={{padding:"5px 8px",borderRadius:7,background:col+"22",border:`1px solid ${col}55`,fontSize:10,fontWeight:600,color:v?col:C.mut}}>{m}{v>0&&` ·${v}`}</div>;})}</div>
      </Card>

      <Card><Lbl>14-Day Activity</Lbl><div style={{display:"flex",gap:3}}>{l14.map((d,i)=>{const w=d.data?.setsT>0;const ok=w&&d.data.setsD===d.data.setsT;return <div key={i} style={{flex:1,textAlign:"center"}}><div style={{fontSize:8,color:C.mut,marginBottom:2}}>{d.dn}</div><div style={{height:24,borderRadius:4,background:ok?C.grn:w?"#D4A84366":d.data?"#ffffff10":"#111",display:"flex",alignItems:"center",justifyContent:"center",fontSize:8,fontWeight:700,color:ok?"#000":C.mut}}>{ok?"✓":w?"½":""}</div><div style={{fontSize:7,color:C.mut,marginTop:1}}>{d.date}</div></div>;})}</div></Card>

      {exWE.length>0&&<Card><Lbl>Progressive Overload</Lbl><div style={{fontSize:11,color:C.sub,marginBottom:8}}>Saved weights — beat these next session.</div>{exWE.map(([n,w])=> <div key={n} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:"1px solid #1a1a1a"}}><span style={{fontSize:12,fontWeight:600,textTransform:"capitalize"}}>{n}</span><span style={{fontFamily:"'Oswald'",fontSize:15,fontWeight:700,color:C.gold}}>{w} lbs</span></div>)}</Card>}

      {pD.length>1&&<Card><Lbl>Protein Trend</Lbl><MC data={pD} target={155} color={C.grn} unit="g"/></Card>}
      {cD.length>1&&<Card><Lbl>Calorie Trend</Lbl><MC data={cD} target={2500} color={C.gold} unit=""/></Card>}
      {wD.length>1&&<Card><Lbl>Weight Trend</Lbl><MC data={wD} color={C.blu} unit="lbs"/></Card>}

      <Card><Lbl>Weekly Averages</Lbl>{(()=>{const d7=[];for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);const h=hist[fmt(d)];if(h)d7.push(h);}if(!d7.length)return <div style={{fontSize:13,color:C.mut}}>Log a few days first.</div>;const av=(a,k)=>Math.round(a.reduce((s,d)=>s+(d[k]||0),0)/a.length);return <div style={{display:"flex",flexWrap:"wrap",gap:8}}>{[{l:"Avg Cal",v:av(d7,"cal"),c:C.gold},{l:"Avg Protein",v:av(d7,"p")+"g",c:C.grn},{l:"Avg Water",v:(av(d7,"water")*.25).toFixed(1)+"L",c:C.blu},{l:"Avg Sleep",v:av(d7,"sleep")+"h",c:C.pur}].map((s,i)=> <div key={i} style={{flex:1,minWidth:"45%",padding:"10px 12px",background:"#111",borderRadius:10,border:"1px solid #1a1a1a"}}><div style={{fontSize:11,color:C.sub,marginBottom:2}}>{s.l}</div><div style={{fontFamily:"'Oswald'",fontSize:20,fontWeight:700,color:s.c}}>{s.v}</div></div>)}</div>;})()}</Card>
      <div style={{height:12}}/>
    </div>
  );
}
function MC({data,target,color,unit}){
  if(data.length<2)return null;const vals=data.map(d=>d.v);const mn=Math.min(...vals,target||Infinity)-5;const mx=Math.max(...vals,target||0)+5;const rng=mx-mn||1;const w=Math.max(260,data.length*36);const h=80;
  const pts=data.map((d,i)=>({x:16+(i/(data.length-1))*(w-32),y:h-10-((d.v-mn)/rng)*(h-25)}));const ln=pts.map((p,i)=>`${i?"L":"M"} ${p.x} ${p.y}`).join(" ");const tY=target?h-10-((target-mn)/rng)*(h-25):null;
  return <div style={{overflowX:"auto"}}><svg width={w} height={h} viewBox={`0 0 ${w} ${h}`}>{tY!=null&&<><line x1={10} y1={tY} x2={w-10} y2={tY} stroke={color} strokeWidth="1" strokeDasharray="4,4" opacity=".3"/><text x={w-8} y={tY-4} textAnchor="end" fill={color} fontSize="8" opacity=".5">{target}{unit}</text></>}<path d={ln} fill="none" stroke={color} strokeWidth="2"/>{pts.map((p,i)=> <g key={i}><circle cx={p.x} cy={p.y} r="3" fill={color}/><text x={p.x} y={p.y-8} textAnchor="middle" fill={C.sub} fontSize="8">{vals[i]}</text><text x={p.x} y={h-1} textAnchor="middle" fill={C.mut} fontSize="7">{data[i].l}</text></g>)}</svg></div>;
}

/* ══════ VITALS TAB ══════ */

        </div>}
        {suppList.map(s=> <div key={s.id} style={{display:"flex",alignItems:"center",gap:12,padding:"8px 0",borderBottom:"1px solid #1a1a1a"}}>
          <button onClick={()=>save({supps:{...dd.supps,[s.id]:!dd.supps[s.id]}})} style={{width:28,height:28,borderRadius:8,border:`2px solid ${dd.supps[s.id]?C.grn:"#333"}`,background:dd.supps[s.id]?C.grn:"transparent",color:dd.supps[s.id]?"#000":C.txt,fontSize:13,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{dd.supps[s.id]?"✓":""}</button>
          <div style={{flex:1}}><div style={{fontSize:13,fontWeight:600}}>{s.name}</div><div style={{fontSize:11,color:C.sub}}>{s.dose}{s.when?` · ${s.when}`:""}</div></div>
          <RemoveBtn label="✕" onConfirm={()=>saveSL(suppList.filter(x=>x.id!==s.id))} style={{background:"none",border:"none",color:C.mut,fontSize:12,cursor:"pointer",padding:"4px 8px",fontFamily:"'DM Sans'"}}/>
        </div>)}
      </Card>

      <Card><Lbl>Daily Checklist</Lbl>{[{l:"Protein 155g+",d:dd.meals.reduce((a,m)=>a+(m.p||0),0)>=155},{l:"Water 3L+",d:dd.water>=12},{l:"Creatine",d:!!dd.supps.creatine},{l:"7+ hrs sleep",d:dd.sleep>=7},{l:"Weight logged",d:!!dd.bw}].map((c,i)=> <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"4px 0",opacity:c.d?1:.4}}><span style={{color:c.d?C.grn:C.mut,fontWeight:700}}>{c.d?"✓":"○"}</span><span style={{fontSize:13}}>{c.l}</span></div>)}</Card>
      <div style={{height:12}}/>
    </div>
  );
}

ReactDOM.render(React.createElement(App),document.getElementById('root'));
</script>
</body>
</html>
